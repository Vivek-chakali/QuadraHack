<!DOCTYPE html>
<html>
<head>
    <title>Airport Lounge Inventory Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-card">
    <h2>Airport Lounge Inventory</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

    </form>
</div>
<div style="margin-top:20px; padding:12px; border:1px solid #ccc; border-radius:8px; background:#f8f8f8;">
    <h4>Demo Access (For Recruiters / Reviewers)</h4>

    <b>Admin Login</b><br>
    Username: admin<br>
    Password: admin123<br><br>

    <b>Staff Login</b><br>
    Username: staff<br>
    Password: staff123
</div>
</body>
</html>
